[project]
name = "isomandu"
version = "0.1.0"
description = "AI-generated retro isometric pixel-art map of Kathmandu, Nepal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.2.0",
    "pyvips>=2.2.3",
    "requests>=2.31.0",
    "replicate>=0.30.0",
    "python-dotenv>=1.0.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
